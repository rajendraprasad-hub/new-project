<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infosys Portal - Contact</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header>
  <div class="logo-box">
    <img src="assets/infosys-logo.svg" alt="Infosys Logo">
    <div class="portal-title">Internal Web Portal</div>
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="reports.html">Reports</a></li>
      <li><a class="active" href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<div class="container">

  <div class="card">
    <h2>Contact Details</h2>
    <p><b>Rajendra Prasad</b></p>
    <p>Process Specialist – MFPM Team (Infosys BPM)</p>
    <p>Email: rajendra.prasad@infosys.com</p>
    <p class="small-text">Use the form below for queries / support request.</p>
  </div>

  <div class="card">
    <h2>Contact Form</h2>

    <form id="contactForm">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message..." required></textarea>
      <button class="btn" type="submit">Send Message</button>
    </form>
  </div>

</div>

<footer>
  © 2026 Infosys BPM | Internal Use Only
</footer>

</body>
</html>
