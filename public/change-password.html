<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header>
  <div class="logo-box">
    <img src="assets/infosys-logo.svg" alt="Infosys Logo">
    <div class="portal-title">Internal Web Portal</div>
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="knowledge.html">Knowledge Base</a></li>
      <li><a href="reports.html">Reports</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="#" onclick="logoutUser()">Logout</a></li>
    </ul>
  </nav>

  <div id="userInfoBox" style="font-size:14px; margin-top:8px;"></div>
</header>

<div class="container">
  <div class="card" style="max-width:500px; margin:auto;">
    <h2>Change Password</h2>

    <input id="oldPass" type="password" placeholder="Old Password"
      style="width:100%; padding:10px; margin:8px 0;" />

    <input id="newPass" type="password" placeholder="New Password"
      style="width:100%; padding:10px; margin:8px 0;" />

    <button class="btn" onclick="changePassword()">Update Password</button>

    <p id="passMsg" style="margin-top:10px;"></p>
  </div>
</div>

<script src="script.js"></script>

<script>
async function changePassword() {
  const oldPassword = document.getElementById("oldPass").value;
  const newPassword = document.getElementById("newPass").value;
  const msg = document.getElementById("passMsg");

  msg.textContent = "Updating...";

  try {
    const res = await fetch("/api/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ oldPassword, newPassword })
    });

    const data = await res.json();

    if (res.ok) {
      msg.textContent = "✅ " + data.message + " Redirecting to Home...";
      setTimeout(() => {
        window.location.href = "/index.html";
      }, 1200);
    } else {
      msg.textContent = "❌ " + (data.message || "Failed");
    }
  } catch (err) {
    msg.textContent = "❌ Server error. Try again.";
  }
}
</script>

</body>
</html>
